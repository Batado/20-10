
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bông hoa đẹp nhất ngày 20/10</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      background: linear-gradient(160deg, #100c2b, #4d286c, #bd648d);
      display: grid;
      place-items: center;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 15% 20%, white 99%, transparent),
        radial-gradient(2px 2px at 80% 30%, white 99%, transparent),
        radial-gradient(1px 1px at 45% 70%, white 99%, transparent),
        radial-gradient(2px 2px at 65% 85%, white 99%, transparent),
        radial-gradient(1px 1px at 25% 90%, white 99%, transparent);
      background-size: 180px 180px;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }
    .card {
      width: min(90%, 440px);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid #ffffff45;
      border-radius: 28px;
      background: #ffffff12;
      box-shadow: 0 20px 70px #08031666;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }
    .flower {
      font-size: 86px;
      display: inline-block;
      filter: drop-shadow(0 0 18px #ff9dc8);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }
    h1 { font-size: clamp(26px, 6vw, 36px); margin: 12px 0; }
    .subtitle { color: #ffe0f0; line-height: 1.7; }
    #message {
      min-height: 76px;
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1.6;
      margin: 20px 0;
      color: #fff1f8;
    }
    button {
      border: 0;
      padding: 13px 24px;
      margin: 5px;
      border-radius: 30px;
      background: #ffb6d5;
      color: #572447;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); background: #ffd0e4; }
    .secondary { background: #ffffff20; color: white; border: 1px solid #ffffff60; }
    .hidden { display: none; }
    .petals {
      position: fixed;
      top: -30px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(540deg); opacity: .2; }
    }
    footer { font-size: 12px; color: #f8d8eb; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="card">
    <div class="flower" aria-hidden="true">🌷</div>
    <h1>Bông hoa đẹp nhất ngày 20/10</h1>
    <p class="subtitle">
      Có một món quà nhỏ dành riêng cho chị.<br>
      Chị nhấn vào đây để nhận nha!
    </p>

    <div id="message" aria-live="polite">
      Nhân dịp ngày đặc biệt bông hoa nở rộ nhất
    </div>

    <button id="next">Mở quà nè</button>
    <button id="restart" class="secondary hidden">Đọc lại</button>
    <footer>Gửi chị một chút dịu dàng trong ngày 20/10</footer>
  </main>

  <script>
    const messages = [
      "Chị xinh đẹp đây òi!",
      "Ngày 20/10 chúc chị luôn vui vẻ, rạng rỡ và được yêu thương thật nhiều.",
      "Mong những điều dễ thương nhất sẽ luôn tìm đến chị.",
      "Cỏ này hong héo âu chị nhận nha 🌱"
    ];

    let index = -1;
    const message = document.getElementById("message");
    const next = document.getElementById("next");
    const restart = document.getElementById("restart");

    next.addEventListener("click", () => {
      index++;
      if (index < messages.length) {
        message.textContent = messages[index];
        createPetals();
      }
      if (index >= messages.length - 1) {
        next.classList.add("hidden");
        restart.classList.remove("hidden");
      }
    });

    restart.addEventListener("click", () => {
      index = -1;
      message.textContent = "Hôm nay có một chị thật đặc biệt…";
      next.classList.remove("hidden");
      restart.classList.add("hidden");
    });

    function createPetals() {
      for (let i = 0; i < 9; i++) {
        const petal = document.createElement("span");
        petal.className = "petals";
        petal.textContent = ["🌸", "🌷", "💗", "✨"][Math.floor(Math.random() * 4)];
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (3 + Math.random() * 4) + "s";
        petal.style.fontSize = (16 + Math.random() * 18) + "px";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 7500);
      }
    }
  </script>
</body>
</html>
